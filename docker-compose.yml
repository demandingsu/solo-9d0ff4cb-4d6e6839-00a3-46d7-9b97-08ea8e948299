services:
  api:
    build: .
    image: coldchain-closure-checker:latest
    ports:
      - "8000:8000"
    environment:
      # SQLite 基线库路径（挂载命名卷，容器重建后基线保留）
      CLOSURE_BASELINE_DB: /srv/data/baseline.db
    volumes:
      - baseline-data:/srv/data
    depends_on:
      sample-site:
        condition: service_started
    networks:
      - closure-net

  sample-site:
    build: ./sample-site
    image: closure-sample-site:latest
    ports:
      - "8080:8080"
    networks:
      - closure-net

networks:
  closure-net:
    driver: bridge

volumes:
  baseline-data:
